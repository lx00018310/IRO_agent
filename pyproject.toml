[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iro-agent"
version = "0.1.0"
description = "Industrial Read-Only Agent (IRO_agent) for industrial software diagnostics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.30.0",
    "psycopg2-binary>=2.9.0",
    "lark-oapi>=1.7.0",
    "playwright>=1.40.0",
    "pyyaml>=6.0",
]

[project.scripts]
iro-agent = "iro_agent.cli:main"

[tool.setuptools.packages.find]
include = ["iro_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
